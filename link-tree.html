            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    // Animation Observer
                    const observerOptions = {
                        root: null,
                        rootMargin: '0px',
                        threshold: 0.2
                    };

                    const observer = new IntersectionObserver((entries, observer) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                const el = entry.target;
                                const type = el.dataset.animeType;
                                const duration = parseInt(el.dataset.animeDuration || '1000');
                                const delay = parseInt(el.dataset.animeDelay || '0');
                                const loop = el.dataset.animeLoop === 'true';
                                const easing = el.dataset.animeEasing || 'easeOutQuad';

                                // Remove opacity 0 override
                                el.style.opacity = '';

                                let animConfig = {
                                    targets: el,
                                    duration: duration,
                                    delay: delay,
                                    loop: loop,
                                    easing: easing
                                };

                                if (type === 'fade-in') {
                                    animConfig.opacity = [0, 1];
                                } else if (type === 'slide-up') {
                                    animConfig.opacity = [0, 1];
                                    animConfig.translateY = [50, 0];
                                } else if (type === 'slide-down') {
                                    animConfig.opacity = [0, 1];
                                    animConfig.translateY = [-50, 0];
                                } else if (type === 'scale-up') {
                                    animConfig.opacity = [0, 1];
                                    animConfig.scale = [0.8, 1];
                                } else if (type === 'draw-stroke') {
                                     const paths = el.querySelectorAll('path, circle, rect, line, polyline, polygon, ellipse');
                                     if (paths.length > 0) {
                                         animConfig = {
                                             targets: paths,
                                             strokeDashoffset: [anime.setDashoffset, 0],
                                             easing: 'easeInOutSine',
                                             duration: duration,
                                             delay: function(el, i) { return i * 250 + delay },
                                             direction: 'alternate',
                                             loop: loop
                                         };
                                     }
                                }

                                anime(animConfig);
                                observer.unobserve(el);
                            }
                        });
                    }, observerOptions);

                    document.querySelectorAll('.anime-element').forEach(el => {
                        observer.observe(el);
                    });

                    // Tabs Logic
                    const tabContainers = document.querySelectorAll('[id^="tabs-"]');
                    tabContainers.forEach(container => {
                        const tabs = container.querySelectorAll('[role="tab"]');
                        const panels = container.querySelectorAll('[role="tabpanel"]');
                        
                        tabs.forEach(tab => {
                            tab.addEventListener('click', () => {
                                tabs.forEach(t => {
                                    t.setAttribute('aria-selected', 'false');
                                    t.style.borderColor = 'transparent';
                                    t.style.color = 'var(--text)';
                                });
                                panels.forEach(p => p.hidden = true);
                                
                                tab.setAttribute('aria-selected', 'true');
                                tab.style.borderColor = 'var(--primary)';
                                tab.style.color = 'var(--primary)';
                                const controlledPanelId = tab.getAttribute('aria-controls');
                                const controlledPanel = document.getElementById(controlledPanelId);
                                if (controlledPanel) {
                                    controlledPanel.hidden = false;
                                }
                            });
                        });
                    });

                    // Carousel Logic
                    document.querySelectorAll('.carousel-container').forEach(carousel => {
                        const track = carousel.querySelector('.carousel-track');
                        const prevBtn = carousel.querySelector('.carousel-prev');
                        const nextBtn = carousel.querySelector('.carousel-next');
                        const dots = carousel.querySelectorAll('.carousel-dot');
                        let currentSlide = 0;
                        const totalSlides = parseInt(carousel.dataset.totalSlides);

                        const updateCarousel = () => {
                            track.style.transform = `translateX(-${currentSlide * 100}%)`;
                            dots.forEach((dot, index) => {
                                dot.style.backgroundColor = index === currentSlide ? 'var(--primary)' : 'rgba(255,255,255,0.5)';
                            });
                        };

                        if(prevBtn) {
                            prevBtn.addEventListener('click', () => {
                                currentSlide = (currentSlide === 0) ? totalSlides - 1 : currentSlide - 1;
                                updateCarousel();
                            });
                        }

                        if(nextBtn) {
                            nextBtn.addEventListener('click', () => {
                                currentSlide = (currentSlide === totalSlides - 1) ? 0 : currentSlide + 1;
                                updateCarousel();
                            });
                        }
                        
                        dots.forEach(dot => {
                            dot.addEventListener('click', (e) => {
                                currentSlide = parseInt(e.target.dataset.index);
                                updateCarousel();
                            });
                        });
                    });
                    
                    // Theme Toggle
                    const themeToggleBtn = document.getElementById('theme-toggle');
                    const htmlEl = document.documentElement;

                    const storedTheme = localStorage.getItem('theme');
                    if (storedTheme) {
                        htmlEl.setAttribute('data-theme', storedTheme);
                    }

                    themeToggleBtn.addEventListener('click', () => {
                        const currentTheme = htmlEl.getAttribute('data-theme');
                        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                        htmlEl.setAttribute('data-theme', newTheme);
                        localStorage.setItem('theme', newTheme);
                    });

                    // Modal Logic
                    const openModal = (modal) => {
                        if (modal == null) return;
                        modal.classList.add('active');
                        document.body.classList.add('modal-open');
                    };

                    const closeModal = (modal) => {
                        if (modal == null) return;
                        modal.classList.remove('active');
                        document.body.classList.remove('modal-open');
                    };

                    const openModalButtons = document.querySelectorAll('[data-modal-target]');
                    
                    openModalButtons.forEach(button => {
                        button.addEventListener('click', () => {
                            const modal = document.querySelector(button.dataset.modalTarget);
                            openModal(modal);
                        });
                    });

                    document.querySelectorAll('.modal-overlay').forEach(overlay => {
                        overlay.addEventListener('click', (e) => {
                            if (e.target === overlay) {
                                closeModal(overlay);
                            }
                        });
                    });
                    
                    document.querySelectorAll('.modal-close-btn, .modal-close-btn-secondary').forEach(button => {
                        button.addEventListener('click', () => {
                            const modal = button.closest('.modal-overlay');
                            closeModal(modal);
                        });
                    });

                    // Product Grid Filtering Logic
                    document.querySelectorAll('.product-grid-section').forEach(grid => {
                        const filterControls = grid.querySelector('.filter-controls');
                        if (!filterControls) return;

                        filterControls.addEventListener('click', (event) => {
                            const button = event.target.closest('.filter-button');
                            if (!button) return;

                            const category = button.dataset.category;
                            
                            filterControls.querySelectorAll('.filter-button').forEach(btn => btn.classList.remove('active'));
                            button.classList.add('active');
                            
                            grid.querySelectorAll('.product-card').forEach(card => {
                                const cardCategories = (card.dataset.categories || '').split(',');
                                if (category === 'All' || cardCategories.includes(category)) {
                                    card.classList.remove('hidden');
                                } else {
                                    card.classList.add('hidden');
                                }
                            });
                        });
                    });
                });
            </script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('dotted-wave-bg');
        
        // --- CONFIGURATION ---
        const PALETTES = {
            dark: {
                bg: '#212428',
                dotBase: '#464D56',
                dotHighlight: '#54C1FB'
            },
            light: {
                bg: '#E0E5EC',
                dotBase: '#CED2B9',
                dotHighlight: '#44A0D1'
            }
        };

        let animationTimeline = null;
        let resizeTimer;

        // --- CORE FUNCTIONS ---

        function createGrid() {
            // 1. Read the current theme from the HTML tag (set by your other script)
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const colors = PALETTES[currentTheme];

            // 2. Apply Background Color
            // We don't touch the button here, your other script handles that!
            container.style.backgroundColor = colors.bg;

            // 3. Reset
            container.innerHTML = ''; 
            if (animationTimeline) animationTimeline.pause(); 

            // 4. Build Grid
            const width = window.innerWidth;
            const height = window.innerHeight;
            const DOT_SPACING = 25;
            const DOT_RADIUS = 1;
            const cols = Math.floor(width / DOT_SPACING);
            const rows = Math.floor(height / DOT_SPACING);
            const isBottomHalfStart = Math.floor(rows / 2);

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');

            let hasDots = false;

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute('cx', j * DOT_SPACING + DOT_SPACING / 2);
                    circle.setAttribute('cy', i * DOT_SPACING + DOT_SPACING / 2);
                    circle.setAttribute('r', DOT_RADIUS);
                    circle.setAttribute('fill', colors.dotBase); 

                    if (i > isBottomHalfStart) {
                        circle.classList.add('wave-dot');
                        hasDots = true;
                    }
                    svg.appendChild(circle);
                }
            }
            container.appendChild(svg);

            if (hasDots) startAnimation(colors);
        }

        function startAnimation(colors) {
            const targets = document.querySelectorAll('.wave-dot');
            
            animationTimeline = anime.timeline({
                loop: true,
                direction: 'normal',
            });

            // Phase 1: Rise
            animationTimeline.add({
                targets: targets,
                fill: [
                    { value: colors.dotHighlight, duration: 1000, easing: 'easeOutQuad' },
                    { value: colors.dotBase, duration: 1000, easing: 'easeInQuad' }
                ],
                delay: function(el, i, total) {
                    const reverseIndex = total - i;
                    return (reverseIndex * 10) + anime.random(0, 800);
                }
            })
            // Phase 2: Fall
            .add({
                targets: targets,
                fill: [
                    { value: colors.dotHighlight, duration: 1000, easing: 'easeOutQuad' },
                    { value: colors.dotBase, duration: 1000, easing: 'easeInQuad' }
                ],
                delay: function(el, i, total) {
                    return (i * 10) + anime.random(0, 800);
                },
                offset: '-=500'
            });
        }

        // --- THE MAGIC GLUE ---
        
        // 1. Initial Draw
        createGrid();

        // 2. Watch for Theme Changes (MutationObserver)
        // This waits for your Main Script to update 'data-theme' on the <html> tag
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                    createGrid(); // Repaint grid when theme changes
                }
            });
        });
        
        // Start watching the <html> tag
        observer.observe(document.documentElement, { attributes: true });

        // 3. Resize Handler
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(createGrid, 200);
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // --- CONFIGURATION ---
        // Define your icon paths here
        const FAVICONS = {
            // Dark Mode usually needs LIGHT/BRIGHT icons to show up on the dark tab bar
            dark: [
                'assets/favicons/dark/Favicon_00.svg',
                'assets/favicons/dark/Favicon_01.svg',
                'assets/favicons/dark/Favicon_02.svg',
                'assets/favicons/dark/Favicon_03.svg',
                'assets/favicons/dark/Favicon_04.svg'
            ],
            // Light Mode usually needs DARK icons
            light: [
                'assets/favicons/light/Favicon_00.svg',
                'assets/favicons/light/Favicon_01.svg',
                'assets/favicons/light/Favicon_02.svg',
                'assets/favicons/light/Favicon_03.svg',
                'assets/favicons/light/Favicon_04.svg'
            ]
        };

        // --- LOGIC ---
        function updateFavicon() {
            // 1. Get current theme (default to dark if missing)
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            
            // 2. Select the correct array
            const iconSet = FAVICONS[currentTheme] || FAVICONS.dark;
            
            // 3. Pick a random icon
            const randomIndex = Math.floor(Math.random() * iconSet.length);
            const selectedIcon = iconSet[randomIndex];

            // 4. Find or Create the Link Tag
            // We look for any link with 'icon' in the rel attribute
            let link = document.querySelector("link[rel*='icon']");
            if (!link) {
                link = document.createElement('link');
                link.type = 'image/x-icon';
                link.rel = 'shortcut icon';
                document.getElementsByTagName('head')[0].appendChild(link);
            }

            // 5. Update the href
            link.href = selectedIcon;
        }

        // --- INITIALIZATION ---
        
        // 1. Run immediately on load
        updateFavicon();

        // 2. Watch for Theme Changes (MutationObserver)
        // This detects when your OTHER script changes the data-theme attribute
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                    updateFavicon(); 
                }
            });
        });

        observer.observe(document.documentElement, { attributes: true });
    });
</script>
