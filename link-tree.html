<script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('dotted-wave-bg');
        
        // Configuration
        const DOT_SPACING = 30;
        const DOT_RADIUS = 2;
        const COLORS = {
            bg: '#212428',
            dotBase: '#464D56',
            dotHighlight: '#54C1FB'
        };

        let animationTimeline = null;

        // --- 1. Grid Generator ---
        function createGrid() {
            // Clear existing SVG if resizing
            container.innerHTML = '';

            // Stop old animation if running
            if (animationTimeline) animationTimeline.pause();

            const width = window.innerWidth;
            const height = window.innerHeight;
            const cols = Math.floor(width / DOT_SPACING);
            const rows = Math.floor(height / DOT_SPACING);
            const isBottomHalfStart = Math.floor(rows / 2);

            // Create SVG Namespace Element
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');

            let dots = [];

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    
                    // Position
                    circle.setAttribute('cx', j * DOT_SPACING + DOT_SPACING / 2);
                    circle.setAttribute('cy', i * DOT_SPACING + DOT_SPACING / 2);
                    circle.setAttribute('r', DOT_RADIUS);
                    circle.setAttribute('fill', COLORS.dotBase);

                    // Logic: Only animate the bottom half
                    if (i > isBottomHalfStart) {
                        circle.classList.add('wave-dot');
                    }
                    
                    svg.appendChild(circle);
                }
            }

            container.appendChild(svg);

            // Store grid info for the animation to access
            startAnimation();
        }

        // --- 2. The Animation (Ping-Pong Logic) ---
        function startAnimation() {
            const targets = document.querySelectorAll('.wave-dot');
            if (targets.length === 0) return;

            animationTimeline = anime.timeline({
                loop: true,
                direction: 'normal',
            });

            // PHASE 1: Rise (Bottom -> Middle)
            animationTimeline.add({
                targets: targets,
                fill: [
                    { value: COLORS.dotHighlight, duration: 1000, easing: 'easeOutQuad' },
                    { value: COLORS.dotBase, duration: 1000, easing: 'easeInQuad' }
                ],
                delay: function(el, i, total) {
                    const reverseIndex = total - i;
                    return (reverseIndex * 10) + anime.random(0, 800);
                }
            })
            // PHASE 2: Fall (Middle -> Bottom)
            .add({
                targets: targets,
                fill: [
                    { value: COLORS.dotHighlight, duration: 1000, easing: 'easeOutQuad' },
                    { value: COLORS.dotBase, duration: 1000, easing: 'easeInQuad' }
                ],
                delay: function(el, i, total) {
                    return (i * 10) + anime.random(0, 800);
                },
                offset: '-=500' // Overlap logic
            });
        }

        // --- 3. Initialization & Resize Handling ---
        createGrid();

        // Debounce resize (wait for user to finish resizing before regenerating)
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(createGrid, 200);
        });
    });
</script>
